version: 2

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: ideascout
    main: ./cmd/ideascout
    binary: ideascout
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'

brews:
  - name: ideascout
    repository:
      owner: vib795
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    folder: Formula
    homepage: "https://github.com/vib795/AI-Idea-Scout"
    description: "Monitor and extract buildable AI/agent product ideas from high-signal sources"
    license: "MIT"
    test: |
      system "#{bin}/ideascout version"
    install: |
      bin.install "ideascout"
